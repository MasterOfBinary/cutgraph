# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "CutGraph Timeline MCP"
  slug: "cutgraph-timeline-mcp"
  kind: existing_plan
  tranche: "Validate and implement the requested CutGraph MCP MVP with source-backed command research, separate docs, timeline docs, and full verification."
  status: complete
  intake:
    original_request: "Build the CutGraph Timeline MCP plan, with deep command research, separate developer/user docs, and MVP/future timeline documentation."
    interpreted_outcome: "A working Python 3.12 uv-managed CutGraph MCP server and CLI exists for non-destructive video editing, backed by researched FFmpeg/ffprobe/OTIO implementation choices and documented for developers and users."
    input_shape: existing_plan
    audience: "Developers and local MCP users of CutGraph."
    authority: requested
    proof_type: test
    completion_proof: "Requested MCP tools and CLI commands are implemented, source-backed implementation research is recorded, developer/user/timeline docs are separate, and schema, timeline, security, media, render planner, integration, and MCP smoke tests pass or skip with explicit FFmpeg/ffprobe availability reasons."
    likely_misfire: "Delivering a scaffold or generic FFmpeg wrapper without validating command feasibility, path safety, docs separation, render-plan explainability, and non-destructive project semantics."
    blind_spots_considered:
      - "Which requested commands map directly to FFmpeg/ffprobe versus custom CutGraph timeline/project logic."
      - "MCP Python SDK/FastMCP API details may have changed and must be checked against official docs."
      - "FFmpeg filters can cover many operations but some edits require planner-generated filter graphs and structured project logic."
      - "Path allowlisting and argv-only command generation must be tested, not just documented."
      - "OpenTimelineIO should remain optional and export-first in v0."
      - "Real FFmpeg integration tests must skip cleanly when binaries are unavailable."
    existing_plan_facts:
      - "Create a Python package in src/cutgraph/ with modules for schema, project store, media probing, timeline operations, render planning, render jobs, CLI, and MCP server."
      - "Use Python 3.12 and uv with dependencies on MCP Python SDK, Pydantic, Typer, Rich, optional OpenTimelineIO, and pytest tooling."
      - "Define .cutgraph.json v0.1 with settings, assets, timelines, nodes, and renders."
      - "Enforce project-root path allowlisting; render outputs under renders/ and cache/proxies under .cutgraph/cache/."
      - "Expose MCP tools for project lifecycle, assets/probing, timeline editing, transitions/overlays/PiP/subtitles, rendering, render status/cancel, and OTIO export."
      - "Expose CLI commands: validate, probe, dry-run, render, and mcp."
      - "Render planner emits argv arrays, never shell strings, and returns explainable plans."
      - "v0 requires users to install FFmpeg/ffprobe separately and returns actionable missing-binary errors."
      - "No UI, no public raw execute_ffmpeg, no CapCut/Premiere parity in v0."
      - "References to validate include MCP Python SDK/docs, FFmpeg docs/filters, and OpenTimelineIO timeline structure docs."

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: bundled_not_installed
  worker: bundled_not_installed
  judge: bundled_not_installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/cutgraph-timeline-mcp/"
    command: "npx goalbuddy board docs/goals/cutgraph-timeline-mcp"
  github_projects:
    status: not_requested
    url: null
    command: "npx goalbuddy extend github-projects"
    missing: []

active_task: null

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Create a source-backed implementation research matrix for every requested MCP tool and CLI command."
    inputs:
      - "User-provided CutGraph Timeline MCP plan in the chat."
      - "Official MCP Python SDK and FastMCP documentation."
      - "Official FFmpeg documentation and ffmpeg-filters documentation."
      - "Official ffprobe documentation."
      - "OpenTimelineIO timeline structure and adapter/export documentation."
    constraints:
      - "Read-only."
      - "Do not edit implementation or docs files."
      - "Use primary/official sources when researching technical APIs and command behavior."
      - "For each command/tool family, state whether FFmpeg/ffprobe/OTIO directly supports it, whether CutGraph must implement project/timeline logic, or whether a filtergraph/planner layer is required."
      - "Record citations or exact source URLs in the note, with dates checked when browsing."
      - "Explicitly answer examples like whether trim is supported by FFmpeg and what CutGraph must implement around it."
    expected_output:
      - "Research matrix covering all public MCP tools and CLI commands."
      - "Dependency decision table: FFmpeg, ffprobe, MCP SDK, Pydantic, Typer, Rich, OpenTimelineIO, and any rejected dependencies."
      - "Implementation notes for trim, split, move, delete, concat, overlays, transitions, PiP, subtitles, preview render, final render, render status/cancel, and OTIO export."
      - "Risks or uncertainties that need Judge decision before coding."
      - "A long-form note at docs/goals/cutgraph-timeline-mcp/notes/T001-command-research.md if findings do not fit on the card."
    receipt:
      result: done
      summary: "Created source-backed research matrix at docs/goals/cutgraph-timeline-mcp/notes/T001-command-research.md covering MCP/CLI tool families, dependencies, FFmpeg/ffprobe/OTIO capability boundaries, render/job semantics, and risks for Judge."
      evidence:
        - "Official MCP Python SDK/FastMCP docs checked."
        - "Official FFmpeg/ffprobe command and filter docs checked."
        - "Official OpenTimelineIO timeline/export docs checked."
        - "Official uv, Pydantic, Typer, and Rich docs checked."
      next: "Judge should validate the plan and approve the largest safe Worker implementation slices."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Validate the user-provided plan against T001 research and choose the implementation sequence."
    inputs:
      - "T001 receipt and research note."
      - "docs/goals/cutgraph-timeline-mcp/goal.md"
      - "docs/goals/cutgraph-timeline-mcp/state.yaml"
    constraints:
      - "Read-only."
      - "Do not implement."
      - "Preserve the user's plan unless research proves a change is needed."
      - "Choose the largest safe useful Worker slices with allowed_files, verify commands, and stop conditions."
    expected_output:
      - "Decision: approved, approved_with_changes, or blocked."
      - "MVP scope confirmation and future-phase boundaries."
      - "Any plan corrections required by source-backed research."
      - "Updated Worker slice recommendations if current queued tasks should be changed."
      - "Specific verification strategy for local and FFmpeg-conditional tests."
    receipt:
      result: approved_with_changes
      summary: "Plan is sound for v0 if implementation keeps OTIO optional, treats FFmpeg build-dependent filters as detected/render-time capabilities, and compiles operations through a planner rather than exposing raw execution."
      mvp_scope:
        - "Keep .cutgraph.json as source of truth with project-root allowlisting."
        - "Implement MCP tools and CLI commands as structured project mutations plus render-plan/execution surfaces."
        - "Use ffprobe for probing and FFmpeg argv plans for rendering."
        - "Represent overlays, PiP, subtitles, and transitions as planner-backed node types with explicit unsupported-case errors."
      changes:
        - "Transition support must include compatibility checks or deterministic planner rejection before render execution."
        - "drawtext/subtitles features must document and test FFmpeg build variance."
        - "OTIO export should be optional and export-first, with no core dependency failure when OpenTimelineIO is absent."
      implementation_sequence:
        - "T003 scaffold/schema/store/security/validate CLI is the right first Worker slice."
        - "T004 should add probe and non-destructive timeline mutation behavior before planner execution."
        - "T005/T006 should separate dry-run planning from process execution and integration checks."
        - "T007 should add MCP/OTIO only after core behavior is stable."
        - "T008/T009/T999 remain appropriate docs, hardening, and audit slices."
      verification_strategy:
        - "Unit tests for schema, store, path safety, timeline operations, render plan argv shape, MCP registration, and OTIO optional handling."
        - "FFmpeg/ffprobe integration tests should skip with explicit reasons when binaries are missing."
        - "CLI help commands must run through uv once package metadata exists."
      next: "Activate T003 Worker."

  - id: T003
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: "Scaffold the uv-managed Python package, core schema, project store, path safety, and basic validation CLI."
    allowed_files:
      - "pyproject.toml"
      - "README.md"
      - "src/cutgraph/**"
      - "tests/**"
      - "docs/cutgraph/**"
    verify:
      - "uv run pytest tests"
      - "uv run cutgraph validate --help"
      - "uv run python -m cutgraph.cli validate --help"
    stop_if:
      - "T001/T002 indicates the package/dependency plan must change materially."
      - "Need files outside allowed_files."
      - "uv cannot create or run the environment after retrying with the approved dependency path."
      - "Validation semantics are ambiguous enough to affect schema compatibility."
    receipt:
      result: done
      summary: "Scaffolded uv package, core Pydantic schema, project store, project-root path policy, and validate CLI."
      files:
        - "pyproject.toml"
        - "src/cutgraph/__init__.py"
        - "src/cutgraph/schema.py"
        - "src/cutgraph/security.py"
        - "src/cutgraph/store.py"
        - "src/cutgraph/cli.py"
        - "tests/test_schema.py"
        - "tests/test_security.py"
        - "tests/test_store.py"
        - "tests/test_cli_validate.py"
      verification:
        - command: "uv run pytest tests"
          result: "10 passed"
        - command: "uv run cutgraph validate --help"
          result: "passed"
        - command: "uv run python -m cutgraph.cli validate --help"
          result: "passed"
      notes:
        - "TDD red observed on missing modules before implementation."
        - "Typer command-group behavior was debugged and fixed with a root callback so `cutgraph validate` remains the public shape."
      next: "Activate T004 Worker for asset probing, timeline operations, schema validation rules, and non-destructive mutation tests."

  - id: T004
