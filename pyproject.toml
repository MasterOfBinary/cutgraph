[project]
name = "cutgraph"
version = "0.1.0"
description = "Local MCP server and CLI for non-destructive video editing projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp[cli]>=1.0",
  "pydantic>=2.0",
  "rich>=13.0",
  "typer>=0.12",
]

[project.optional-dependencies]
otio = ["OpenTimelineIO>=0.16"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
cutgraph = "cutgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cutgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require system media binaries or real render execution",
]
